    <script>
      // Apply the saved/system theme before first paint to avoid a light flash in dark mode
      try {
        var saved = localStorage.getItem('penko-theme');
        if (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      // Apply saved reading options (text size, font, spacing) before first paint too
      try {
        var r = JSON.parse(localStorage.getItem('penko-reading') || '{}'), h = document.documentElement;
        if (r.size) h.style.fontSize = ['100%', '112.5%', '125%', '137.5%'][r.size];
        if (r.font === 'readable') h.style.setProperty('--reading-font', '"Atkinson Hyperlegible"');
        if (r.font === 'dyslexic') h.style.setProperty('--reading-font', '"OpenDyslexic"');
        if (r.spacing) h.classList.add('a11y-spacing');
        if (r.underline) h.classList.add('a11y-underline');
        if (r.reduceMotion) h.classList.add('a11y-reduce-motion');
      } catch (e) {}
    </script>
