<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Penko Station | Free, Open-Source Apps for Everyone</title>
    <meta name="title" content="Penko Station | Free, Open-Source Apps for Everyone" />
    <meta name="description" content="A non-profit ecosystem of free, privacy-first Progressive Web Apps (PWAs). No ads, no tracking, no subscriptions. Just software for everyone." />
    <meta name="keywords" content="open source, pwa, free software, privacy, offline first, language learning, office suite, web apps" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://penkosoftware.org/" />
    <meta property="og:title" content="Penko Station | Free, Open-Source Apps for Everyone" />
    <meta property="og:description" content="A non-profit ecosystem of free, privacy-first Progressive Web Apps (PWAs). No ads, no tracking, no subscriptions." />
    <meta property="og:image" content="https://penkosoftware.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Penko Station: free software, private by default" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://penkosoftware.org/" />
    <meta name="twitter:title" content="Penko Station | Free, Open-Source Apps for Everyone" />
    <meta name="twitter:description" content="A non-profit ecosystem of free, privacy-first Progressive Web Apps (PWAs). No ads, no tracking, no subscriptions." />
    <meta name="twitter:image" content="https://penkosoftware.org/og-image.png" />

    <script>
      // Apply the saved/system theme before first paint to avoid a light flash in dark mode
      try {
        var saved = localStorage.getItem('penko-theme');
        if (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
